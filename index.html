<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penta Tri Saka | Operations</title><style>
:root{--blue:#1e40af;--bright:#2563eb;--soft:#eff6ff;--bg:#f8fafc;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--red:#dc2626;--green:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Arial,sans-serif}.app{display:flex;min-height:100vh}.sidebar{width:244px;background:#fff;border-right:1px solid var(--line);padding:24px 14px}.brand{display:flex;gap:11px;align-items:center;padding:0 10px 26px;font-weight:800;font-size:16px}.brand i{display:grid;place-items:center;background:var(--blue);color:#fff;width:35px;height:35px;border-radius:9px;font-style:normal}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;margin-top:3px}.nav label{padding:16px 12px 7px;color:#94a3b8;text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.08em;display:block}.nav button{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:8px;color:#475569;cursor:pointer;font-weight:600}.nav button.active,.nav button:hover{background:var(--soft);color:var(--blue)}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.top h1{font-size:18px;margin:0}.profile{color:var(--muted);font-size:12px}.avatar{display:inline-grid;place-items:center;background:#dbeafe;color:var(--blue);width:32px;height:32px;border-radius:50%;font-weight:800;margin-left:9px}.content{padding:32px;max-width:1440px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.hero h2{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:24px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px #0f172a0a}.stat{padding:20px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:8px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);padding:0 20px}.tabs button{padding:15px 13px;border:0;background:transparent;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}.tabs button.active{color:var(--blue);border-color:var(--blue)}.toolbar{padding:20px;display:flex;gap:12px;justify-content:space-between}.search{width:280px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:var(--bright);box-shadow:0 0 0 3px #dbeafe;outline:none}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:#1d4ed8}.btn.light{background:#fff;color:var(--blue);border:1px solid #bfdbfe}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:14px 20px;border-top:1px solid var(--line);white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;background:#f8fafc}td{font-size:13px}.code{font-family:monospace;font-weight:700;color:var(--blue)}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:700}.badge.ok{background:#dcfce7;color:var(--green)}.empty{text-align:center;color:var(--muted);padding:40px}.actions{display:flex;gap:8px}.iconbtn{border:0;background:transparent;color:var(--bright);cursor:pointer;font-weight:700}.iconbtn.delete{color:var(--red)}.modal{position:fixed;inset:0;background:#0f172a80;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.dialog{background:#fff;border-radius:14px;width:min(680px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 60px #0f172a55}.dialog header{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}.dialog h3{margin:0;font-size:18px}.close{border:0;background:#f1f5f9;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:18px}.form{padding:24px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:700;font-size:12px}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;width:100%}.field textarea{resize:vertical;min-height:70px}.error{color:var(--red);font-size:11px;min-height:13px}.form footer{grid-column:1/-1;display:flex;justify-content:flex-end;gap:9px;padding-top:8px}.toast{position:fixed;right:24px;bottom:24px;background:#0f172a;color:#fff;padding:13px 17px;border-radius:9px;transform:translateY(80px);opacity:0;transition:.25s;z-index:9}.toast.show{transform:none;opacity:1}@media(max-width:760px){.sidebar{display:none}.content{padding:20px}.top{padding:0 20px}.stats{grid-template-columns:1fr}.hero{align-items:start;gap:15px}.toolbar{flex-wrap:wrap}.search{width:100%}.form{grid-template-columns:1fr}.dialog{max-height:96vh}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><i>PTS</i><div>PENTA TRI SAKA<small>ENTERPRISE OPERATIONS</small></div></div><nav class="nav"><label>Operasional</label><button>? Dashboard</button><button>? Form Order</button><button>? Penjadwalan</button><label>Master Data</label><button class="active">? Database</button><button>? Surat Jalan</button><label>Keuangan</label><button>? Invoice & Keuangan</button><button>? Laporan</button></nav></aside><main class="main"><header class="top"><h1>Database Master</h1><div class="profile">Owner / Administrator <span class="avatar">PT</span></div></header><section class="content"><div class="hero"><div><h2>Pusat Data Perusahaan</h2><p>Kelola aset, karyawan, dan klien dalam satu tempat.</p></div><button class="btn light" onclick="resetDemo()">Reset data demo</button></div><div class="stats"><div class="stat"><span>Total Barang</span><strong id="statBarang">0</strong></div><div class="stat"><span>Karyawan Aktif</span><strong id="statKaryawan">0</strong></div><div class="stat"><span>Total Klien</span><strong id="statKlien">0</strong></div></div><section class="panel"><div class="tabs"><button class="active" data-type="barang">Data Barang</button><button data-type="karyawan">Data Karyawan</button><button data-type="klien">Data Klien</button></div><div class="toolbar"><input class="search" id="search" placeholder="Cari data..." oninput="render()"><button class="btn primary" id="addBtn" onclick="openModal()">+ Tambah Barang</button></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section></section></main></div><div class="modal" id="modal"><div class="dialog"><header><div><h3 id="modalTitle">Tambah Data</h3><small id="modalHint" style="color:#64748b">Lengkapi informasi yang diperlukan.</small></div><button class="close" onclick="closeModal()">×</button></header><form class="form" id="form" novalidate></form></div></div><div class="toast" id="toast"></div><script>
const key='penta-trisaka-master-v1';let type='barang',editId=null;let state=JSON.parse(localStorage.getItem(key))||{barang:[{id:1,kode:'CAM-001',nama:'Sony FX3 Body',kategori:'Camera',stok:'4',rusak:'0',sewa:'0',harga:'1200000',deskripsi:'Full-frame cinema line camera'}],karyawan:[{id:1,nama:'Budi Santoso',nik:'3174-001',jabatan:'Sound Engineer',telp:'081234567890',rekening:'BCA 1234567890',status:'Aktif'}],klien:[{id:1,nama:'PT Tiga Kreasi',perusahaan:'PT Tiga Kreasi Indonesia',telp:'021-5551234',email:'event@tigakreasi.co.id',alamat:'HK Tower, Jakarta',npwp:'01.234.567.8-012.000'}]};
const configs={barang:{label:'Barang',headers:['Kode','Nama Barang','Kategori','Stok','Rusak','Disewa','Harga/Hari'],fields:[['kode','Kode Barang','text',1],['nama','Nama Barang','text',1],['kategori','Kategori','select',1,['Camera','Sound System','Lighting System','TV','LED Videotron','Streaming & Hybrid','Produksi']],['stok','Jumlah Total','number',1],['rusak','Stok Rusak','number',0],['sewa','Sedang Disewa','number',0],['harga','Harga Rental / Hari (Rp)','number',1],['deskripsi','Spesifikasi / Deskripsi','textarea',0]]},karyawan:{label:'Karyawan',headers:['Nama','NIK','Jabatan','No. Telepon','Rekening','Status'],fields:[['nama','Nama Lengkap','text',1],['nik','NIK','text',1],['jabatan','Jabatan','text',1],['telp','No. Telp / WhatsApp','tel',1],['rekening','No. Rekening Bank','text',0],['status','Status','select',1,['Aktif','Non-Aktif']]]},klien:{label:'Klien',headers:['Nama Klien','Perusahaan','Telepon','Email','NPWP','Alamat'],fields:[['nama','Nama Klien / PIC','text',1],['perusahaan','Nama Perusahaan','text',1],['telp','No. Telepon','tel',1],['email','Email','email',0],['npwp','NPWP','text',0],['alamat','Alamat','textarea',0]]}};
function save(){localStorage.setItem(key,JSON.stringify(state))}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0)}function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function render(){let c=configs[type],q=document.querySelector('#search').value.toLowerCase(),rows=state[type].filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));document.querySelector('#addBtn').textContent='+ Tambah '+c.label;document.querySelector('#thead').innerHTML='<tr>'+c.headers.map(h=>'<th>'+h+'</th>').join('')+'<th>Aksi</th></tr>';document.querySelector('#tbody').innerHTML=rows.length?rows.map(x=>{let cells=type==='barang'?`<td class="code">${esc(x.kode)}</td><td><b>${esc(x.nama)}</b></td><td><span class="badge">${esc(x.kategori)}</span></td><td>${x.stok}</td><td>${x.rusak}</td><td>${x.sewa}</td><td>${money(x.harga)}</td>`:type==='karyawan'?`<td><b>${esc(x.nama)}</b></td><td>${esc(x.nik)}</td><td>${esc(x.jabatan)}</td><td>${esc(x.telp)}</td><td>${esc(x.rekening||'—')}</td><td><span class="badge ${x.status==='Aktif'?'ok':''}">${x.status}</span></td>`:`<td><b>${esc(x.nama)}</b></td><td>${esc(x.perusahaan)}</td><td>${esc(x.telp)}</td><td>${esc(x.email||'—')}</td><td>${esc(x.npwp||'—')}</td><td>${esc(x.alamat||'—')}</td>`;return '<tr>'+cells+`<td><div class="actions"><button class="iconbtn" onclick="openModal(${x.id})">Ubah</button><button class="iconbtn delete" onclick="remove(${x.id})">Hapus</button></div></td></tr>`}).join(''):`<tr><td class="empty" colspan="20">Belum ada data ${c.label.toLowerCase()}.</td></tr>`;document.querySelector('#statBarang').textContent=state.barang.length;document.querySelector('#statKaryawan').textContent=state.karyawan.filter(x=>x.status==='Aktif').length;document.querySelector('#statKlien').textContent=state.klien.length}
function openModal(id){let c=configs[type],data=id?state[type].find(x=>x.id===id):{};editId=id||null;document.querySelector('#modalTitle').textContent=(id?'Ubah ':'Tambah ')+c.label;document.querySelector('#form').innerHTML=c.fields.map(([n,l,t,req,opt])=>`<div class="field ${t==='textarea'?'full':''}"><label>${l}${req?' *':''}</label>${t==='select'?`<select name="${n}" ${req?'required':''}><option value="">Pilih ${l}</option>${opt.map(v=>`<option ${data[n]===v?'selected':''}>${v}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${n}" ${req?'required':''}>${esc(data[n]||'')}</textarea>`:`<input name="${n}" type="${t}" value="${esc(data[n]||'')}" ${req?'required':''} ${t==='number'?'min="0"':''}>`}<span class="error"></span></div>`).join('')+'<footer><button type="button" class="btn light" onclick="closeModal()">Batal</button><button class="btn primary">Simpan Data</button></footer>';document.querySelector('#form').onsubmit=submit;document.querySelector('#modal').classList.add('open')}
function closeModal(){document.querySelector('#modal').classList.remove('open')}function submit(e){e.preventDefault();let f=e.currentTarget,valid=true;f.querySelectorAll('[required]').forEach(i=>{let er=i.parentElement.querySelector('.error');er.textContent=i.value.trim()?'':'Wajib diisi.';valid&&=!!i.value.trim()});if(!valid)return;let data=Object.fromEntries(new FormData(f));if(type==='barang'&&+data.rusak>+data.stok){f.querySelector('[name=rusak]').parentElement.querySelector('.error').textContent='Stok rusak tidak boleh melebihi stok total.';return}if(editId)Object.assign(state[type].find(x=>x.id===editId),data);else state[type].push({id:Date.now(),...data});save();closeModal();render();toast('Data '+configs[type].label.toLowerCase()+' berhasil disimpan.')}
function remove(id){if(confirm('Hapus data ini? Tindakan tidak dapat dibatalkan.')){state[type]=state[type].filter(x=>x.id!==id);save();render();toast('Data berhasil dihapus.')}}function resetDemo(){if(confirm('Kembalikan seluruh data demo?')){localStorage.removeItem(key);location.reload()}}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#search').value='';render()});render();
</script></body></html>
